name: Cavity educational discretisation experiment

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Fixed educational campaign (no Pump CFD claim)
        required: true
        default: laminar-re100
        type: choice
        options:
          - laminar-re100
          - laminar-re100-refined
          - laminar-re100-temporal
          - ras-early

permissions:
  contents: read
  actions: read

concurrency:
  group: cfd-development-validation
  cancel-in-progress: false

jobs:
  numerical-development-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'simcalc/OpenFoam' && vars.PUBLIC_EDUCATIONAL_RUNS_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFD_CAVITY_PROFILE: ${{ inputs.profile || 'laminar-re100' }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          sparse-checkout: |
            services/cfd_worker
            tools/cfd_worker
            tests
            .github/workflows
            docs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - name: Verify public educational standard-runner scope
        id: allowance
        run: python -B tools/cfd_worker/public_runner_guard.py
      - name: Contract and process resource regression (not a CFD solve)
        run: python -B -m unittest discover -s tests -v
      - name: Install checksum-pinned OpenFOAM Foundation 12
        run: bash tools/cfd_worker/install_openfoam12.sh
      - name: Real bounded fixed cavity discretisation experiment
        id: experiment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +eu
          source /opt/openfoam12/etc/bashrc
          foam_source_status=$?
          set -euo pipefail
          if (( foam_source_status != 0 )); then
            printf 'OpenFOAM environment setup failed (exit %s).\n' "$foam_source_status" >&2
            exit "$foam_source_status"
          fi
          if [[ "${WM_PROJECT_VERSION:-}" != "12" ]]; then
            printf 'OpenFOAM Foundation 12 environment is required.\n' >&2
            exit 2
          fi
          for foam_program in blockMesh checkMesh foamRun; do
            if ! foam_executable="$(command -v "$foam_program")" || [[ ! -f "$foam_executable" || ! -x "$foam_executable" ]]; then
              printf 'Required OpenFOAM executable is unavailable: %s\n' "$foam_program" >&2
              exit 2
            fi
          done
          foam_library_path="${LD_LIBRARY_PATH:-}"
          if [[ -z "$foam_library_path" || ${#foam_library_path} -gt 32768 || "$foam_library_path" == *$'\n'* || "$foam_library_path" == *$'\r'* ]]; then
            printf 'A bounded, nonempty OpenFOAM library path is required.\n' >&2
            exit 2
          fi
          if [[ -z "${FOAM_LIBBIN:-}" || ! -f "$FOAM_LIBBIN/libblockMesh.so" || ":$foam_library_path:" != *":$FOAM_LIBBIN:"* ]]; then
            printf 'OpenFOAM mesh library must exist in the configured library path.\n' >&2
            exit 2
          fi
          mkdir -p outputs/cavity-convergence
          sudo --preserve-env=PATH,LD_LIBRARY_PATH,WM_PROJECT_VERSION,WM_PROJECT_DIR,FOAM_LIBBIN,FOAM_APPBIN,FOAM_ETC,GITHUB_TOKEN \
            systemd-run --scope --unit="untirta-cavity-convergence-${GITHUB_RUN_ID}" \
            -p Delegate=yes -p MemoryMax=2147483648 -p MemorySwapMax=0 -p CPUQuota=100% -p TasksMax=32 \
            /usr/bin/env "LD_LIBRARY_PATH=$foam_library_path" \
            "$(command -v python)" -B tools/cfd_worker/run_cavity_convergence.py \
            --workspace outputs/cavity-convergence --report outputs/cavity-convergence/report.json \
            --archive outputs/cavity-convergence/cavity-convergence-evidence.zip \
            --profile "$CFD_CAVITY_PROFILE" \
            2>&1 | tee outputs/cavity-convergence-run.log
      - name: Verify public runner again and prepare bounded output evidence
        id: upload-guard
        if: ${{ always() && !cancelled() && steps.allowance.outcome == 'success' && hashFiles('outputs/cavity-convergence/cavity-convergence-evidence.zip') != '' }}
        run: python -B tools/cfd_worker/public_runner_guard.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !cancelled() && steps.upload-guard.outcome == 'success' }}
        with:
          name: cavity-discretisation-development-evidence
          path: |
            outputs/cavity-convergence/cavity-convergence-evidence.zip
            outputs/cavity-convergence/report.json
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Preserve bounded sanitized failure diagnostics
        id: diagnostics
        if: ${{ failure() && !cancelled() && steps.allowance.outcome == 'success' }}
        run: |
          python -B tools/cfd_worker/public_runner_guard.py
          python -B tools/cfd_worker/prepare_diagnostics.py --root outputs --report outputs/cavity-convergence/report.json --output outputs/cavity-convergence-diagnostics.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ failure() && steps.diagnostics.outcome == 'success' }}
        with:
          name: cavity-discretisation-development-diagnostics
          path: outputs/cavity-convergence-diagnostics.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
